[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mask_maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "gerbonara",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.gui-scripts]
mask-maker = "mask_maker.app:main"
