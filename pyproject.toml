[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mask_maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials",
    "gerbonara",
    "pathvalidate>=3.3.1",
    "platformdirs>=4.12.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mask_maker = ["jobs/*"]

[project.gui-scripts]
mask-maker = "mask_maker.app:main"
